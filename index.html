  },
  // step-by-step "how to fly" card that changes with what the rocket is doing
  flyGuide(i, stageFuel, totalFuel) {
    if (G.hideFlyTips) return '<div class="fgmini">🚀 How to fly: <b>G</b></div>';
    const B = i.B, top = B.atmo ? B.atmo.top : 0;
    if (B.maxH == null) { let m = 0; if (B.terr) for (const H of B.terr.h) for (let k = 0; k < H.length; k += 7) m = Math.max(m, H[k]); B.maxH = m; }
    const safe = Math.max(top, B.maxH) + 15, target = Math.ceil(safe / 5) * 5;
    const ap = isFinite(i.ap) ? Math.round(i.ap) : Infinity, pe = Math.round(i.pe);
    const card = (title, steps, extra) => `<div class="fgtitle">🚀 ${title}</div><ol>${steps.map(t => `<li>${t}</li>`).join('')}</ol>${extra ? `<div class="fgextra">${extra}</div>` : ''}<div class="fghide">G: hide tips</div>`;
    const bar = (now, goal, label, fm) => { fm = fm || fmtDist; const f = clamp(now / goal, 0, 1) * 100; return `${label}: <b>${isFinite(now) ? fm(now) : '∞'}</b> / ${fm(goal)}<div class="fgbar"><div style="width:${f}%"></div></div>`; };
    const orbitDv = Math.round(Math.sqrt(B.GM / (B.R + target)) * 1.3 + (B.atmo ? 25 : 0));
    if (Ship.landed) {
      if (totalFuel <= 0.01) return card('Out of fuel', ['Press <b>F</b> to get out.', 'Find <b>ice</b> and crack it into fuel (needs an Ice Cracker), or fly a rescue rocket.']);
      return card('Blast off!', [
        'Hold <b>SHIFT</b> to turn the engine up (or tap <b>Z</b> for full power).',
        'Go straight up first, keep the nose pointing at the sky.',
        'Save some fuel to land! Coming down, hold <b>L</b> to land by itself.',
        `To reach <b>orbit</b> you need about <b>${orbitDv} m/s</b> of Δv. You have <b>${Math.round(i.dv)}</b>.`],
        i.dv < orbitDv ? '💡 Not enough for orbit yet. Just hop around, or build a bigger tank in the Hangar!' : '');
    }
    if (stageFuel <= 0.01 && totalFuel > 0.01) return card('Stage is empty!', ['Press <b>SPACE</b> to drop the empty part and light the next engine.']);
    const orbit = isFinite(i.ap) && pe > safe - 10;
    const falling = i.vr < -2 && i.radar < 150 && !orbit;
    if (totalFuel <= 0.01 && !orbit) return card('No fuel left!', [
      Ship.chuteCount ? 'Press <b>P</b> to open the parachute (in the air only).' : 'No parachute... brace for impact! 😬',
      'Try to point the nose up so you land on your legs.']);
    if (falling) return card('Time to land', [
      'Easy way: hold <b>L</b> and the rocket lands itself!',
      'Point the nose <b>up</b>: aim at the <b>⊗</b> circle (that\'s “backwards”).',
      'Burn with <b>SHIFT</b> to slow down. Let go (or <b>X</b>) when you are slow.',
      `Touch down slower than <b>8 m/s</b>. Right now: <b>${Math.abs(i.vr).toFixed(0)} m/s</b> down.`,
      Ship.chuteCount && Ship.chute === 0 && B.atmo ? 'In air you can press <b>P</b> for the parachute.' : 'Land on flat ground so you don\'t tip over.'],
      Math.abs(i.vr) > 8 && i.radar < 40 ? '⚠️ Too fast! Burn harder!' : '');
    if (orbit) return card('You\'re in orbit! 🎉', [
      'Let go of the throttle and enjoy the view. Use <b>.</b> to speed up time.',
      'Press <b>M</b> for the map to plan a trip to another world.',
      'To <b>go higher</b>: point at <b>⊕</b> and burn. To <b>come down</b>: point at <b>⊗</b> and burn until Periapsis goes below 0.']);
    const leanAt = Math.round(Math.max(12, target * 0.15));
    if (i.alt < leanAt && i.vr > 0) return card('Going up!', [
      'Keep the nose pointing <b>straight up</b>.',
      `At about <b>${leanAt} m</b> high, use <b>WASD</b> to lean the rocket over, about halfway.`,
      'Leaning over makes you fly sideways. Going fast sideways is what makes an orbit!'], bar(i.alt, leanAt, 'Height'));
    if (ap < target) return card('Lean over and burn', [
      'Lean over about <b>halfway</b> (WASD) and keep burning (<b>SHIFT</b>).',
      `Burn until <b>Apoapsis</b> (your highest point) reaches <b>${fmtDist(target)}</b>.`,
      'Then press <b>X</b> to cut the engine.'], bar(ap, target, 'Apoapsis'));
    const vOrb = Math.sqrt(B.GM / (B.R + target));
    if (i.vh < vOrb * 0.35 && i.pitch > 50) return card('Lean over more!', [
      'You\'re flying too <b>straight up</b>. You\'ll just fall back down!',
      'Use <b>WASD</b> to lean the rocket over toward the horizon and keep burning (<b>SHIFT</b>).',
      'Going fast <b>sideways</b> is what keeps you up in orbit.'], bar(i.vh, vOrb, 'Sideways speed', x => Math.round(x) + ' m/s'));
    return card('Make it round', [
      'Press <b>X</b> to cut the engine and coast up.',
      'When <b>Up/down</b> speed gets close to 0 (near the top), lean all the way over, point at the <b>⊕</b> circle.',
      `Burn until <b>Periapsis</b> is above <b>${fmtDist(safe - 10)}</b>. Then you're in orbit!`], bar(Math.max(0, pe), safe - 10, 'Periapsis'));
  },
  keyHelp() {
    let k = '';
    if (Game.mode === 'foot' && Rover.driving) k = 'W/S drive · A/D steer · SHIFT boost · SPACE jump (W/S/A/D in the air = flips!) · hold LMB drill arm · E get out · V park at rocket · M map';
    else if (Game.mode === 'foot') k = 'WASD walk · SHIFT run · SPACE jump (again to flip, hold for jetpack) · hold LMB laser · E use · F rocket · 1 eat · 2 drink · M map · H help';
    else if (Game.mode === 'ship') k = Ship.landed ? 'SHIFT throttle up · Z full · L auto-land · G fly tips · F get out · R crack ice · U flip upright · M map · H help'
      : 'L auto-land · G fly tips · SHIFT/CTRL throttle · Z/X full/cut · WASD tilt · Q/E roll · SPACE stage · P chute · T stability · , . warp · M map';
    if (this.el.keyhelp.textContent !== k) this.el.keyhelp.textContent = k;
  },
  // 🚀 marker over your rocket (on foot); arrow at the screen edge when it's off-screen
  shipMarker() {
    const el = this.el.mkShip;
    const hide = () => { if (!el.classList.contains('hide')) el.classList.add('hide'); };
    if (Game.mode !== 'foot' || Game.ui || MapView.open || !Ship.exists || !Ship.group.parent || !Player.model) return hide();
    const cam = World.camera, sp = this._sp || (this._sp = new V3()), pp = this._pp || (this._pp = new V3()), bc = this._bc || (this._bc = new V3());
    Ship.group.getWorldPosition(sp); Player.model.root.getWorldPosition(pp);
    Bodies[Ship.soi].group.getWorldPosition(bc);
    const dist = sp.distanceTo(pp);
    if (dist < 8) return hide();
    sp.addScaledVector(bc.subVectors(sp, bc).normalize(), 6.5);   // float it above the nose
    const c = sp.clone().applyMatrix4(cam.matrixWorldInverse);       // camera space (looks down -z)
    const n = sp.clone().project(cam);
    const W = innerWidth, H = innerHeight, m = 46;
    let x, y, off = false;
    if (c.z < 0 && Math.abs(n.x) < 0.94 && Math.abs(n.y) < 0.9) { x = (n.x * 0.5 + 0.5) * W; y = (-n.y * 0.5 + 0.5) * H; }
    else {
      off = true;
      let dx = c.x, dy = -c.y;
      if (c.z >= 0 && Math.hypot(dx, dy) < 1e-3) dy = 1;
      const k = Math.min((W / 2 - m) / Math.max(1e-6, Math.abs(dx)), (H / 2 - m) / Math.max(1e-6, Math.abs(dy)));
      x = W / 2 + dx * k; y = H / 2 + dy * k;
      el.firstChild.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
    }
    el.classList.remove('hide'); el.classList.toggle('off', off);
    el.style.transform = `translate(${x}px, ${y}px)`;
    const txt = '🚀 ' + (dist < 1000 ? Math.round(dist) + ' m' : (dist / 1000).toFixed(1) + ' km');
    if (el.lastChild.textContent !== txt) el.lastChild.textContent = txt;
  },
  // prograde / retrograde markers in 3D view
  markers() {
    const pro = this.el.mkPro, ret = this.el.mkRetro;
    if (Game.mode !== 'ship' || !Ship.exists || Ship.landed || MapView.open || Ship.v.length() < 0.5) { pro.style.display = ret.style.display = 'none'; return; }
    const cam = World.camera, d = Ship.v.clone().normalize();
    for (const [el, sign] of [[pro, 1], [ret, -1]]) {
      const wp = d.clone().multiplyScalar(30 * sign).project(cam);
      if (wp.z > 1 || wp.z < -1) { el.style.display = 'none'; continue; }
      el.style.display = 'block';
      el.style.left = ((wp.x * 0.5 + 0.5) * innerWidth) + 'px';
      el.style.top = ((-wp.y * 0.5 + 0.5) * innerHeight) + 'px';
    }
  },
};

</script>
<script>
/* terminal.js */
'use strict';
// Home base terminal: storage + selling, shop, suits, and the hangar tab.

function shipAtPad() {
  const V = Bodies.verdant;
  return Ship.exists && Ship.soi === 'verdant' && Ship.landed && V.padPos && Ship.p.distanceTo(V.padPos) < 30;
}
function payInvs() { return [G.storage]; }

const Terminal = {
  tab: 'store', el: null, msg: '',
  open(tab) {
    this.el = $('terminal');
    this.tab = tab || 'store';
    Game.ui = 'terminal'; Input.unlock();
    // unload ore from backpack and rocket
    let fromPack = 0, fromShip = 0;
    for (const k of Object.keys(G.pack)) if (ITEMS[k].kind === 'ore' || ITEMS[k].kind === 'loot') { fromPack += G.pack[k]; Inv.add(G.storage, k, G.pack[k]); delete G.pack[k]; }
    if (shipAtPad()) {
      for (const k of Object.keys(Ship.cargo)) if (ITEMS[k].kind === 'ore' || ITEMS[k].kind === 'loot') { fromShip += Ship.cargo[k]; Inv.add(G.storage, k, Ship.cargo[k]); delete Ship.cargo[k]; }
      Ship.refreshMass();
    }
    this.msg = fromPack || fromShip ? `Unloaded ${fmtKg(fromPack)} from your backpack${fromShip ? ` and ${fmtKg(fromShip)} from your rocket` : ''} into base storage.` : '';
    this.el.classList.remove('hide');
    if (this.tab === 'hangar') Hangar.begin();
    this.render();
    Sfx.ui();
  },
  close() {
    if (this.tab === 'hangar') Hangar.end();
    this.el.classList.add('hide'); Game.ui = null; Game.autosave();
  },
  setTab(t) {
    if (this.tab === 'hangar' && t !== 'hangar') Hangar.end();
    this.tab = t; if (t === 'hangar') Hangar.begin();
    Sfx.ui(); this.render();
  },
  render() {
    const tabs = [['store', '📦 Storage & Sell'], ['shop', '🛒 Shop'], ['suits', '🧑‍🚀 Suits'], ['hangar', '🚀 Hangar']];
    const head = `<div class="thead"><div class="ttitle">Home Base</div><div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${this.tab === k ? 'on' : ''}" data-tab="${k}">${n}</button>`).join('')}</div>
      <div class="tcoins">🪙 ${fmtInt(G.coins)}</div><button class="x" data-act="close">✕</button></div>`;
    let body = '';
    if (this.tab === 'store') body = this.storeHTML();
    if (this.tab === 'shop') body = this.shopHTML();
    if (this.tab === 'suits') body = this.suitsHTML();
    if (this.tab === 'hangar') body = Hangar.html();
    this.el.className = 'panel terminal' + (this.tab === 'hangar' ? ' hangarmode' : '');
    this.el.innerHTML = head + `<div class="tbody">${body}</div>`;
    this.el.onclick = e => {
      const b = e.target.closest('[data-tab],[data-act]'); if (!b || b.disabled) return;
      if (b.dataset.tab) return this.setTab(b.dataset.tab);
      this.act(b.dataset.act, b.dataset.arg);
    };
    if (this.tab === 'hangar') Hangar.afterRender();
  },
  storeHTML() {
    let h = this.msg ? `<div class="note">${this.msg}</div>` : '';
    // rocket card
    h += '<div class="card"><h3>🚀 Your rocket</h3>';
    if (!Ship.exists) h += '<p>You have no rocket! Build one in the <b>Hangar</b> tab.</p>';
    else if (!shipAtPad()) h += `<p>Your rocket is ${Ship.soi === 'verdant' ? 'away from the launch pad' : 'on/near ' + Bodies[Ship.soi].name}. Bring it back to the pad to refuel, repair or unload it here.</p>`;
    else {
      const [tf, tc] = Ship.totalFuel(), need = tc - tf, price = Math.ceil(need * 0.15 * G.dset.fuelPrice);
      const broken = Ship.alive.some(a => !a);
      h += `<p>Fuel ${fmtKg(tf)} / ${fmtKg(tc)} · Cargo ${fmtKg(Inv.mass(Ship.cargo))} / ${fmtKg(Ship.cargoCap())}</p>
        <button class="btn" data-act="refuel" ${need < 1 || G.coins < 1 ? 'disabled' : ''}>⛽ Fill tanks (🪙${fmtInt(Math.min(price, G.coins))})</button>`;
      if (broken) { const c = repairCost(); h += ` <button class="btn" data-act="repair" ${Inv.canPay([G.storage], c, G.coins) ? '' : 'disabled'}>🔧 Repair missing parts (${Inv.costText(c, [G.storage], G.coins)})</button>`; }
    }
    h += '</div>';
    // storage
    const keys = ORE_IDS.filter(k => (G.storage[k] || 0) > 0.01);
    let total = 0; for (const k of keys) total += Math.floor(G.storage[k]) * ITEMS[k].price * G.dset.sell;
    h += `<div class="card"><h3>📦 Base storage</h3>`;
    if (!keys.length) h += '<p class="dim">Empty. Go mine some glowing rocks! (Hold left mouse on them.)</p>';
    else {
      h += `<table class="inv"><tr><th>Item</th><th>Amount</th><th>Price</th><th></th></tr>`;
      for (const k of keys) {
        const it = ITEMS[k], amt = Math.floor(G.storage[k]), pr = it.price * G.dset.sell;
        h += `<tr><td><span class="sw" style="background:#${new THREE.Color(it.color).getHexString()}"></span>${it.name}</td><td>${amt} kg</td><td>🪙${pr.toFixed(1)}/kg</td>
          <td><button class="btn sm" data-act="sell" data-arg="${k}:10" ${amt < 10 ? 'disabled' : ''}>Sell 10</button> <button class="btn sm" data-act="sell" data-arg="${k}:all" ${amt < 1 ? 'disabled' : ''}>Sell all (🪙${fmtInt(amt * pr)})</button></td></tr>`;
      }
      h += `</table><button class="btn" data-act="sellall" ${total < 1 ? 'disabled' : ''}>Sell everything except ice (🪙${fmtInt(total - Math.floor(G.storage.ice || 0) * G.dset.sell)})</button>`;
      h += `<p class="dim">Tip: keep materials to build rocket parts in the Hangar. Rare stuff sells for lots!</p>`;
    }
    h += '</div>';
    // supplies
    const sup = ['berries', 'fruit', 'ration', 'water', 'kit'].filter(k => G.pack[k] > 0).map(k => `${ITEMS[k].icon} ${ITEMS[k].name} ×${G.pack[k]}`).join(' · ');
    h += `<div class="card"><h3>🎒 Backpack supplies</h3><p>${sup || '<span class="dim">Nothing. Buy rations and water in the Shop.</span>'}</p></div>`;
    return h;
  },
  shopHTML() {
    let h = '<div class="grid">';
    const card = (id, name, desc, cost, can, owned, btn) => `<div class="card shopc"><h3>${name}</h3><p>${desc}</p><p class="cost">${owned ? '<span class="ok">✔ Owned</span>' : Inv.costText(cost, [G.storage], G.coins)}</p>
      ${owned ? '' : `<button class="btn" data-act="buy" data-arg="${id}" ${can ? '' : 'disabled'}>${btn || 'Buy'}</button>`}</div>`;
    for (const s of SHOP) {
      const cost = Object.assign({ coins: s.coins }, s.mats || {});
      let owned = false, can = Inv.canPay([G.storage], cost, G.coins), desc = s.desc;
      if (s.drill) { owned = G.drill >= s.drill; if (G.drill < s.drill - 1) { can = false; desc += ' <b>(Buy Mk' + (s.drill - 1) + ' first)</b>'; } }
      if (s.kit) { if (!shipAtPad()) { can = false; desc += ' <b>(Your rocket must be on the pad)</b>'; } else if (Ship.cargoFree() < 250) { can = false; desc += ' <b>(Needs 250 kg of free cargo space. Add a Cargo Bay!)</b>'; } }
      h += card(s.id, s.name, desc, cost, can, owned);
    }
    for (const id in PARTS) {
      const p = PARTS[id]; if (!p.bp) continue;
      const owned = !!G.unlocks[id], cost = { coins: p.bp };
      h += card('bp:' + id, '📘 ' + p.name + ' blueprint', p.desc + ' Lets you build it in the Hangar.', cost, Inv.canPay([], cost, G.coins), owned);
    }
    return h + '</div>';
  },
  suitsHTML() {
    let h = '<div class="grid">';
    for (const id in SUITS) {
      const s = SUITS[id], owned = G.suits.includes(id), worn = G.suit === id;
      const prot = s.protect.length ? s.protect.map(p => HAZARD_INFO[p].icon).join(' ') : 'none';
      h += `<div class="card shopc ${worn ? 'worn' : ''}"><div class="suitsw"><span style="background:#${new THREE.Color(s.body).getHexString()}"></span><span style="background:#${new THREE.Color(s.trim).getHexString()}"></span></div>
        <h3>${s.name}</h3><p>${s.desc}</p><p>🫧 ${s.o2}s oxygen · 🎒 ${s.pack} kg · protects: ${prot}</p>
        ${owned ? (worn ? '<p class="ok">Wearing it!</p>' : `<button class="btn" data-act="wear" data-arg="${id}">Wear</button>`)
          : `<p class="cost">${Inv.costText(s.cost, [G.storage], G.coins)}</p><button class="btn" data-act="suit" data-arg="${id}" ${Inv.canPay([G.storage], s.cost, G.coins) ? '' : 'disabled'}>Unlock</button>`}</div>`;
    }
    return h + '</div>';
  },
  act(a, arg) {
    if (a === 'close') return this.close();
    if (a === 'sell' || a === 'sellall') {
      const list = a === 'sellall' ? ORE_IDS.filter(k => k !== 'ice') : [arg.split(':')[0]];
      let got = 0;
      for (const k of list) {
        const have = Math.floor(G.storage[k] || 0); if (!have) continue;
        const n = a === 'sellall' || arg.endsWith('all') ? have : Math.min(10, have);
        Inv.add(G.storage, k, -n); got += n * ITEMS[k].price * G.dset.sell;
      }
      G.coins += Math.round(got); if (got > 0) { Sfx.coin(); Game.milestone('firstSale'); this.msg = `Sold for 🪙${fmtInt(got)}!`; }
    }
    if (a === 'refuel') {
      const [tf, tc] = Ship.totalFuel(); const per = 0.15 * G.dset.fuelPrice;
      const kg = Math.min(tc - tf, G.coins / per); const cost = Math.ceil(kg * per);
      Ship.fillFuel(kg); G.coins -= cost; Sfx.coin(); this.msg = `Filled ${fmtKg(kg)} of fuel for 🪙${cost}.`;
    }
    if (a === 'repair') { const c = repairCost(); if (Inv.canPay([G.storage], c, G.coins)) { Inv.pay([G.storage], c); G.coins -= c.coins || 0; doRepair(); this.msg = 'Rocket repaired!'; } }
    if (a === 'buy') {
      if (arg.startsWith('bp:')) {
        const id = arg.slice(3), p = PARTS[id];
        if (G.coins >= p.bp) { G.coins -= p.bp; G.unlocks[id] = true; Sfx.good(); this.msg = `Unlocked the ${p.name}! Build it in the Hangar.`; if (id === 'cracker') Game.milestone('cracker'); }
      } else {
        const s = SHOP.find(x => x.id === arg), cost = Object.assign({ coins: s.coins }, s.mats || {});
        if (!Inv.canPay([G.storage], cost, G.coins)) return;
        Inv.pay([G.storage], cost); G.coins -= s.coins;
        if (s.give) for (const k in s.give) Inv.add(G.pack, k, s.give[k]);
        if (s.drill) { G.drill = s.drill; Hud.toast(`Drill Mk${s.drill} equipped!`); }
        if (s.kit) { Inv.add(Ship.cargo, 'kit', 1); Ship.refreshMass(); Hud.toast('Outpost Kit loaded into your rocket.'); }
        Sfx.good(); this.msg = `Bought ${s.name}.`;
      }
    }
    if (a === 'suit') {
      const s = SUITS[arg]; if (!Inv.canPay([G.storage], s.cost, G.coins)) return;
      Inv.pay([G.storage], s.cost); G.coins -= s.cost.coins || 0; G.suits.push(arg); G.suit = arg; Player.setSuit(arg);
      Sfx.good(); Hud.toast(`Unlocked the ${s.name}!`);
      if (Object.keys(SUITS).every(k => G.suits.includes(k))) Game.milestone('allSuits');
    }
    if (a === 'wear') { G.suit = arg; Player.setSuit(arg); Sfx.ui(); }
    if (a.startsWith('h_')) return Hangar.act(a, arg);
    this.render();
  },
};

// ---------- repairing ----------
function repairCost() {
  const c = {};
  Ship.lay.parts.forEach((p, i) => {
    if (Ship.alive[i]) return;
    for (const k in p.def.cost) c[k] = (c[k] || 0) + Math.ceil(p.def.cost[k] * 0.5);
  });
  return c;
}
function doRepair() {
  Ship.alive = Ship.alive.map(() => true);
  Ship.lay.parts.forEach((p, i) => { if (Ship.fuel[i] == null) Ship.fuel[i] = 0; });
  Ship.rebuild(false);
  if (Ship.landed) Ship.placeOn(Ship.soi, Ship.p.clone().normalize(), 0);
  Sfx.good();
}

</script>
<script>
/* hangar.js */
'use strict';
// The hangar: snap rocket parts together in 3D. Parts cost materials from base storage.

const Hangar = {
  scene: null, camera: null, draft: null, mode: 'new', sel: null, sym: 3, model: null, yaw: 0.7, pitch: 0.2, dist: 10, boxes: [], active: false,
  init() {
    const s = this.scene = new THREE.Scene();
    s.background = new THREE.Color(0x26304d);
    s.add(new THREE.HemisphereLight(0xdfe8ff, 0x403850, 0.75));
    const d = new THREE.DirectionalLight(0xffffff, 0.75); d.position.set(5, 10, 7); s.add(d);
    const floor = new THREE.Mesh(new THREE.CylinderGeometry(6, 6.4, 0.3, 48), toonMat({ color: 0x8b93a6 }));
    floor.position.y = -0.15; s.add(floor);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(4.6, 0.12, 8, 48), toonMat({ color: 0xffd23f })); ring.rotation.x = Math.PI / 2; ring.position.y = 0.02; s.add(ring);
    const grid = new THREE.GridHelper(60, 30, 0x3d4a74, 0x34406a); grid.position.y = -0.31; s.add(grid);
    this.floorY = 0;
    this.camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
  },
  begin() {
    this.active = true; this.sel = null;
    if (shipAtPad()) {
      this.mode = 'edit';
      // drop broken parts from the design (they are gone)
      const keepStack = [], map = {};
      Ship.lay.parts.forEach((p, i) => { if (!p.radial && Ship.alive[i]) { map[p.stack] = keepStack.length; keepStack.push(p.id); } });
      const rad = Ship.design.radial.filter(r => map[r.at] != null && Ship.lay.parts.some((p, i) => p.radial && p.group === r && Ship.alive[i]))
        .map(r => ({ at: map[r.at], id: r.id, n: r.n }));
      this.draft = { stack: keepStack, radial: rad };
      this.fuelKept = Ship.totalFuel()[0];
    } else if (!Ship.exists) {
      this.mode = 'new';
      this.draft = G.draft || { stack: ['pod'], radial: [] };
      this.fuelKept = 0;
    } else this.mode = 'away';
    this.rebuildPreview();
  },
  end() {
    if (!this.active) return;
    this.active = false;
    if (this.mode === 'edit' && shipAtPad()) this.applyToShip();
    if (this.mode === 'new') G.draft = this.draft;
    if (this.model) { this.scene.remove(this.model.group); this.model = null; }
    this.clearBoxes();
  },
  applyToShip() {
    const cargo = Ship.cargo, fuel = this.fuelKept;
    Ship.create(this.draft, false);
    Ship.placeOnPad();
    // pour the old fuel back in and keep cargo (extra goes to storage)
    Ship.fillFuel(fuel);
    let free = Ship.cargoCap();
    for (const k of Object.keys(cargo)) {
      const m = cargo[k] * Inv.unitMass(k), fit = Math.min(cargo[k], Math.floor(free / Inv.unitMass(k)));
      if (fit > 0) { Inv.add(Ship.cargo, k, fit); free -= fit * Inv.unitMass(k); }
      if (cargo[k] - fit > 0) Inv.add(G.storage, k, cargo[k] - fit);
      void m;
    }
    Ship.refreshMass();
  },
  html() {
    if (this.mode === 'away') {
      return `<div class="card center"><h3>Your rocket is out there!</h3><p>Your rocket is ${Ship.soi === 'verdant' ? 'somewhere on Verdant, away from the pad' : 'at ' + Bodies[Ship.soi].name}.
        You can only change it when it's on the launch pad.</p><p>Or you can abandon it and build a brand new one (it will be lost forever).</p>
        <button class="btn warn" data-act="h_abandon">Abandon it and build a new rocket</button></div>`;
    }
    const st = designStats(this.draft);
    const unlocked = id => !PARTS[id].bp || G.unlocks[id];
    let pal = '';
    for (const cat of PART_CATS) {
      pal += `<div class="cat">${cat}</div>`;
      for (const id in PARTS) {
        const p = PARTS[id]; if (p.cat !== cat) continue;
        const ok = unlocked(id), cost = p.cost, n = p.radial ? this.sym : 1;
        const mult = {}; for (const k in cost) mult[k] = cost[k] * n;
        const can = ok && Inv.canPay([G.storage], mult, G.coins);
        const stats = p.kind === 'engine' ? `${p.thrust} kN · ${p.ve} m/s` : p.fuel ? `${p.fuel} kg fuel` : p.cargo ? `${p.cargo} kg cargo` : `${p.mass} kg`;
        pal += `<button class="part ${can ? '' : 'no'}" data-act="h_add" data-arg="${id}" title="${p.desc || ''}" ${ok ? '' : 'disabled'}>
          <b>${p.name}${p.radial ? ` ×${n}` : ''}</b><small class="d">${p.desc || ''}</small><small>${ok ? stats : '🔒 buy blueprint in Shop'}</small><small class="c">${ok ? Inv.costText(mult, [G.storage], G.coins) : ''}</small></button>`;
      }
    }
    const selId = this.sel ? (this.sel.radial ? this.draft.radial[this.sel.ri].id : this.draft.stack[this.sel.stack]) : null;
    const selTxt = this.sel ? `<b>${this.selName()}</b><br><span class="small">${PARTS[selId].desc}</span>` : 'Click a part on the rocket to select it.';
    const twrCls = st.twr < 1 ? 'no' : 'ok';
    return `<div class="hangar">
      <div class="hpal">${pal}</div>
      <div class="hview" id="hview"><div class="htip">Drag to spin · scroll to zoom · click a part to select</div></div>
      <div class="hside">
        <div class="card"><h3>Rocket</h3>
          <div class="row"><span>Mass (full)</span><b>${fmtKg(st.wet)}</b></div>
          <div class="row"><span>Fuel</span><b>${fmtKg(st.fuel)}</b></div>
          <div class="row"><span>Δv (full tanks)</span><b>${Math.round(st.dv)} m/s</b></div>
          <div class="row"><span>Thrust/weight on Verdant</span><b class="${twrCls}">${st.twr.toFixed(2)}</b></div>
          <div class="row"><span>Cargo space</span><b>${fmtKg(st.cargo)}</b></div>
          <p class="dim small">Thrust/weight must be above <b>1</b> to lift off!</p>
          <div class="trips">${[['Orbit Verdant', 140], ['Pip and back', 280], ['Glacia or Cinder and back', 450], ['Zyx and back', 640]]
            .map(([t, d]) => `<div class="${st.dv >= d ? 'ok' : ''}"><span>${st.dv >= d ? '✅' : '⬜'} ${t}</span><b>${d} m/s</b></div>`).join('')}</div>
          <p class="dim small">Tip: Medium Tank ×2 + Puff + 2 Side Boosters gets you to Glacia!</p></div>
        <div class="card"><h3>Selected</h3><p>${selTxt}</p>
          <button class="btn sm" data-act="h_up" ${this.canMove(-1) ? '' : 'disabled'}>▲ Move up</button>
          <button class="btn sm" data-act="h_down" ${this.canMove(1) ? '' : 'disabled'}>▼ Move down</button>
          <button class="btn sm warn" data-act="h_remove" ${this.sel && !(this.sel.stack === 0 && !this.sel.radial) ? '' : 'disabled'}>✕ Remove (refund)</button></div>
        <div class="card"><h3>Side parts</h3><p class="small">Side parts (legs, fins, chutes, boosters) stick to the selected part. How many around?</p>
          ${[2, 3, 4].map(n => `<button class="btn sm ${this.sym === n ? 'on' : ''}" data-act="h_sym" data-arg="${n}">${n}</button>`).join(' ')}</div>
        ${this.mode === 'new' ? `<button class="btn big" data-act="h_roll">🚀 Roll out to the launch pad</button>` : `<p class="dim small">Changes are saved to your rocket when you close the terminal. Fuel you already had is kept. New tanks start empty: fill them in the Storage tab.</p>`}
      </div></div>`;
  },
  afterRender() {
    const v = $('hview'); if (!v) return;
    v.onmousedown = e => { this.down = { x: e.clientX, y: e.clientY, moved: false }; };
    v.onmousemove = e => {
      if (!this.down || !(e.buttons & 1)) return;
      const dx = e.clientX - this.down.x, dy = e.clientY - this.down.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) this.down.moved = true;
      this.yaw -= e.movementX * 0.01; this.pitch = clamp(this.pitch + e.movementY * 0.005, -0.3, 1.2);
    };
    v.onmouseup = e => { if (this.down && !this.down.moved) this.pick(e); this.down = null; };
    v.onwheel = e => { e.preventDefault(); this.dist = clamp(this.dist * (e.deltaY > 0 ? 1.1 : 0.9), 4, 60); };
  },
  selName() {
    const s = this.sel; if (!s) return '';
    if (s.radial) { const r = this.draft.radial[s.ri]; return `${PARTS[r.id].name} ×${r.n} (on ${PARTS[this.draft.stack[r.at]].name})`; }
    return PARTS[this.draft.stack[s.stack]].name + (s.stack === 0 ? ' (the pod stays on top)' : '');
  },
  canMove(d) {
    const s = this.sel; if (!s || s.radial || s.stack === 0) return false;
    const t = s.stack + d; return t >= 1 && t < this.draft.stack.length;
  },
  pick(e) {
    const v = $('hview'), r = v.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 2 - 1, y = -((e.clientY - r.top) / r.height) * 2 + 1;
    const rc = new THREE.Raycaster(); rc.setFromCamera({ x, y }, this.camera);
    const hits = this.model ? rc.intersectObject(this.model.group, true) : [];
    this.sel = null;
    for (const h of hits) {
      const i = h.object.userData.partIdx; if (i == null) continue;
      const p = this.model.lay.parts[i];
      if (p.radial) this.sel = { radial: true, ri: this.draft.radial.indexOf(p.group), stack: p.stack };
      else this.sel = { radial: false, stack: p.stack };
      break;
    }
    Sfx.ui(); this.rebuildPreview(); Terminal.render();
  },
  partCost(id, n) { const c = {}; for (const k in PARTS[id].cost) c[k] = PARTS[id].cost[k] * (n || 1); return c; },
  refund(id, n) { const c = this.partCost(id, n); for (const k in c) { if (k === 'coins') G.coins += c[k]; else Inv.add(G.storage, k, c[k]); } },
  charge(id, n) {
    const c = this.partCost(id, n);
    if (!Inv.canPay([G.storage], c, G.coins)) { Hud.toast('Not enough materials! Mine more ore.', 'bad'); Sfx.bad(); return false; }
    Inv.pay([G.storage], c); G.coins -= c.coins || 0; return true;
  },
  act(a, arg) {
    const D = this.draft;
    if (a === 'h_abandon') {
      Ship.remove(); Hud.toast('Old rocket abandoned. Build a new one!'); this.begin(); Terminal.render(); return;
    }
    if (a === 'h_sym') { this.sym = +arg; }
    if (a === 'h_add') {
      const p = PARTS[arg];
      if (p.radial) {
        const at = this.sel && !this.sel.radial ? this.sel.stack : D.stack.length - 1;
        if (p.kind === 'booster' && PARTS[D.stack[at]].kind === 'pod') { Hud.toast('Put boosters on a tank or engine, not the pod.'); return; }
        if (!this.charge(arg, this.sym)) return;
        D.radial.push({ at, id: arg, n: this.sym });
        this.sel = { radial: true, ri: D.radial.length - 1, stack: at };
      } else if (p.kind === 'pod') {
        if (D.stack[0] === arg) { Hud.toast('You already have that pod.'); return; }
        if (!this.charge(arg, 1)) return;
        this.refund(D.stack[0], 1); D.stack[0] = arg;
      } else {
        if (!this.charge(arg, 1)) return;
        const at = this.sel && !this.sel.radial ? this.sel.stack + 1 : D.stack.length;
        D.stack.splice(at, 0, arg);
        for (const r of D.radial) if (r.at >= at) r.at++;
        this.sel = { radial: false, stack: at };
      }
      Sfx.plink(); Game.milestone('firstBuild');
    }
    if (a === 'h_remove' && this.sel) {
      const s = this.sel;
      if (s.radial) { const r = D.radial[s.ri]; this.refund(r.id, r.n); D.radial.splice(s.ri, 1); }
      else if (s.stack > 0) {
        this.refund(D.stack[s.stack], 1);
        for (let k = D.radial.length - 1; k >= 0; k--) { const r = D.radial[k]; if (r.at === s.stack) { this.refund(r.id, r.n); D.radial.splice(k, 1); } else if (r.at > s.stack) r.at--; }
        D.stack.splice(s.stack, 1);
        if (this.mode === 'edit') this.fuelKept = Math.min(this.fuelKept, designStats(D).fuel);
      }
      this.sel = null; Sfx.ui();
    }
    if ((a === 'h_up' || a === 'h_down') && this.canMove(a === 'h_up' ? -1 : 1)) {
      const i = this.sel.stack, j = i + (a === 'h_up' ? -1 : 1);
      [D.stack[i], D.stack[j]] = [D.stack[j], D.stack[i]];
      for (const r of D.radial) { if (r.at === i) r.at = j; else if (r.at === j) r.at = i; }
      this.sel.stack = j;
    }
    if (a === 'h_roll') {
      const st = designStats(D);
      if (!D.stack.some(id => PARTS[id].kind === 'engine') && !D.radial.some(r => PARTS[r.id].kind === 'booster')) { Hud.toast('Your rocket needs an engine!', 'bad'); return; }
      Ship.create(D, false); Ship.placeOnPad(); G.draft = null; this.mode = 'edit'; this.fuelKept = 0;
      Hud.toast('Rocket rolled out to the launch pad! Fill its tanks in the Storage tab.');
      void st; Sfx.good(); Terminal.setTab('store'); return;
    }
    this.rebuildPreview(); Terminal.render();
  },
  clearBoxes() { for (const b of this.boxes) this.scene.remove(b); this.boxes = []; },
  rebuildPreview() {
    if (this.model) this.scene.remove(this.model.group);
    this.clearBoxes();
    if (this.mode === 'away' || !this.draft) { this.model = null; return; }
    this.model = buildShipModel(this.draft, null);
    if (this.model.pilot) this.model.pilot.visible = true;
    // stand it on the floor: legs reach below the bottom part
    let lo = 0; for (const c of contactPoints(this.model.lay, this.model.lay.parts.map(() => true))) lo = Math.min(lo, c.v.y);
    this.model.group.position.y = -lo + 0.02;
    this.scene.add(this.model.group);
    this.height = this.model.lay.height - lo;
    if (this.sel) {
      this.model.group.updateMatrixWorld(true);
      this.model.partGroups.forEach((g, i) => {
        if (!g) return; const p = this.model.lay.parts[i];
        const match = this.sel.radial ? (p.radial && this.draft.radial.indexOf(p.group) === this.sel.ri) : (!p.radial && p.stack === this.sel.stack);
        if (match) { const bh = new THREE.BoxHelper(g, 0xffe040); this.scene.add(bh); this.boxes.push(bh); }
      });
    }
  },
  render(renderer) {
    const v = $('hview');
    const W = innerWidth, H = innerHeight;
    let r = v ? v.getBoundingClientRect() : { left: 0, top: 0, width: W, height: H };
    const ty = (this.height || 3) * 0.5;
    this.camera.aspect = r.width / Math.max(1, r.height); this.camera.updateProjectionMatrix();
    const d = Math.max(this.dist, (this.height || 3) * 1.6);
    this.camera.position.set(Math.sin(this.yaw) * Math.cos(this.pitch) * d, ty + Math.sin(this.pitch) * d, Math.cos(this.yaw) * Math.cos(this.pitch) * d);
    this.camera.lookAt(0, ty, 0);
    renderer.setScissorTest(false); renderer.setClearColor(0x141a2e); renderer.clear();
    renderer.setViewport(r.left, H - r.top - r.height, r.width, r.height);
    renderer.setScissor(r.left, H - r.top - r.height, r.width, r.height); renderer.setScissorTest(true);
    renderer.render(this.scene, this.camera);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
    this.yaw += 0.0015;
  },
};

<script>
/* outposts.js */
'use strict';
// Outposts: little domes you build on other worlds, then upgrade into big bases.

const Outposts = {
  built: {}, // outpost index -> group
  buildFor(b) { G.outposts.forEach((o, i) => { if (o.body === b.id && !this.built[i]) this.make(o, i); }); },
  make(o, i) {
    const B = Bodies[o.body], up = new V3().fromArray(o.dir).normalize();
    const g = new THREE.Group();
    const east = anyTangent(up), north = new V3().crossVectors(up, east);
    const base = up.clone().multiplyScalar(groundR(B, up) - 0.3);
    g.position.copy(base); upQuat(up, 0, g.quaternion);
    const white = toonMat({ color: 0xf4f1ea }), orange = toonMat({ color: 0xff8a3d }), dark = toonMat({ color: 0x3b4252 }),
      glow = toonMat({ color: 0x5fe8ff, emissive: 0x2a9ab0 }), glass = toonMat({ color: 0xaef0ff, transparent: true, opacity: 0.45 });
    const M = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };
    // level 1: dome
    M(new THREE.SphereGeometry(3, 28, 14, 0, TAU, 0, Math.PI / 2), white, 0, 0, 0);
    const band = M(new THREE.TorusGeometry(3, 0.2, 8, 40), orange, 0, 0.6, 0); band.rotation.x = Math.PI / 2;
    const win = M(new THREE.TorusGeometry(2.55, 0.14, 8, 40), glow, 0, 1.6, 0); win.rotation.x = Math.PI / 2;
    M(new THREE.BoxGeometry(1.4, 2.0, 1), dark, 0, 1.0, 2.75);
    M(new THREE.CylinderGeometry(0.06, 0.06, 2.5, 6), dark, 0, 4.0, 0);
    const light = M(new THREE.SphereGeometry(0.22, 10, 8), toonMat({ color: 0xff5050, emissive: 0xc02020 }), 0, 5.3, 0);
    if (o.level >= 2) { // greenhouse
      M(new THREE.SphereGeometry(2.4, 24, 12, 0, TAU, 0, Math.PI / 2), glass, 5.2, 0, 0);
      const bush = new THREE.Mesh(propGeo('bush').geo, VCOL_MAT); bush.position.set(5.2, 0, 0); bush.scale.setScalar(1.6); g.add(bush);
      const tube = M(new THREE.CylinderGeometry(0.6, 0.6, 2.2, 14), white, 2.9, 0.6, 0); tube.rotation.z = Math.PI / 2;
    }
    if (o.level >= 3) { // ice works
      for (const z of [-1.4, 1.4]) { M(new THREE.CylinderGeometry(1, 1, 3.2, 18), white, -5.4, 1.6, z); M(new THREE.TorusGeometry(1.02, 0.1, 6, 20), glow, -5.4, 2.4, z).rotation.x = Math.PI / 2; }
      const pipe = M(new THREE.CylinderGeometry(0.25, 0.25, 2.6, 10), dark, -3.4, 0.8, 0); pipe.rotation.z = Math.PI / 2;
    }
    if (o.level >= 4) { // trade pad + beacon
      M(new THREE.CylinderGeometry(5, 5.3, 0.4, 36), toonMat({ color: 0x8b93a6 }), 0, 0.1, -10);
      const r = M(new THREE.TorusGeometry(4, 0.14, 8, 40), toonMat({ color: 0xffd23f }), 0, 0.33, -10); r.rotation.x = Math.PI / 2;
      M(new THREE.CylinderGeometry(0.25, 0.4, 7, 10), white, 4.5, 3.5, -4.5);
      M(new THREE.SphereGeometry(0.45, 12, 8), glow, 4.5, 7.2, -4.5);
    }
    g.userData.light = light;
    B.group.add(g);
    this.built[i] = g;
    if (B.colliders) B.colliders.push({ p: base.clone().addScaledVector(up, 0.3), r: 3.1, outpost: i });
    void north;
  },
  rebuild(i) {
    const g = this.built[i]; if (g && g.parent) g.parent.remove(g);
    delete this.built[i];
    const B = Bodies[G.outposts[i].body];
    if (B.colliders) B.colliders = B.colliders.filter(c => c.outpost !== i);
    this.make(G.outposts[i], i);
  },
  clearAll() { for (const k in this.built) { const g = this.built[k]; g.parent && g.parent.remove(g); } this.built = {}; },
  nearest(bodyId, p, r) {
    let best = null, bd = r;
    G.outposts.forEach((o, i) => {
      if (o.body !== bodyId) return;
      const d = new V3().fromArray(o.dir).normalize().multiplyScalar(groundR(Bodies[bodyId], new V3().fromArray(o.dir).normalize())).distanceTo(p);
      if (d < bd) { bd = d; best = { o, i }; }
    });
    return best;
  },
  update(dt) {
    for (const o of G.outposts) {
      if (o.level >= 2) { o.stock = Math.min(6, (o.stock || 0) + Math.max(0, G.time - (o.t || G.time)) / 120); }
      o.t = G.time;
    }
    for (const k in this.built) { const l = this.built[k].userData.light; if (l) l.material.emissive.setHex(Math.sin(G.time * 3 + +k) > 0 ? 0xc02020 : 0x300808); }
  },
  canBuild() {
    const B = Bodies[Player.body];
    if (!Ship.exists || !(Ship.cargo.kit > 0)) return 'You need an Outpost Kit in your rocket (buy one at the home base).';
    if (Ship.soi !== Player.body || Ship.p.distanceTo(Player.p) > 60) return 'Your rocket (with the kit) must be close by.';
    if (B.home && Player.p.distanceTo(B.padPos) < 200) return 'Too close to the home base!';
    if (this.nearest(Player.body, Player.p, 80)) return 'There is already an outpost near here.';
    if (Player.swim) return "You can't build in the water!";
    return null;
  },
  create() {
    const why = this.canBuild(); if (why) { Hud.toast(why); Sfx.bad(); return; }
    Inv.add(Ship.cargo, 'kit', -1); Ship.refreshMass();
    const dir = Player.p.clone().normalize().addScaledVector(Player.facing, 5 / Bodies[Player.body].R).normalize();
    G.outposts.push({ body: Player.body, dir: dir.toArray(), level: 1, stock: 0, t: G.time });
    this.make(G.outposts[G.outposts.length - 1], G.outposts.length - 1);
    Fx.burst(Player.body, dir.clone().multiplyScalar(groundR(Bodies[Player.body], dir) + 1), 0xffffff, 30, 6, 0.3, 1);
    Sfx.good(); Hud.toast(`🏕️ Outpost built on ${Bodies[Player.body].name}! It refills oxygen and is your new respawn point.`);
    G.respawn = { body: Player.body, dir: dir.toArray() };
    Game.milestone('outpost'); Game.autosave();
  },
  // ---------- outpost panel ----------
  invs() { const l = [G.pack]; if (Ship.exists && Ship.soi === Player.body && Ship.p.distanceTo(Player.p) < 70) l.push(Ship.cargo); return l; },
  open(i) {
    this.cur = i; Game.ui = 'outpost'; Input.unlock();
    const o = G.outposts[i];
    G.respawn = { body: o.body, dir: o.dir.slice() };
    this.msg = 'Respawn point set here. Oxygen refilled.';
    $('outpost').classList.remove('hide'); this.render(); Sfx.ui();
  },
  close() { $('outpost').classList.add('hide'); Game.ui = null; Game.autosave(); },
  render() {
    const o = G.outposts[this.cur], el = $('outpost'), L = OUTPOST_LEVELS, invs = this.invs();
    const shipHere = invs.length > 1;
    let h = `<div class="thead"><div class="ttitle">🏕️ Outpost on ${Bodies[o.body].name} — Level ${o.level} ${L[o.level].name}</div><button class="x" data-act="close">✕</button></div><div class="tbody">`;
    if (this.msg) h += `<div class="note">${this.msg}</div>`;
    h += '<div class="grid">';
    if (o.level >= 2) h += `<div class="card"><h3>🌱 Greenhouse</h3><p>${Math.floor(o.stock)} rations ready.</p><button class="btn" data-act="collect" ${o.stock >= 1 ? '' : 'disabled'}>Collect</button></div>`;
    if (o.level >= 3) {
      const ice = invs.reduce((s, v) => s + (v.ice || 0), 0);
      h += `<div class="card"><h3>🧊 Ice Works</h3><p>You have ${Math.floor(ice)} kg of ice${shipHere ? '' : ' (land your rocket nearby to use its cargo)'}.</p>
        <button class="btn" data-act="icefuel" ${ice >= 1 && shipHere ? '' : 'disabled'}>Turn ice into rocket fuel</button>
        <button class="btn" data-act="icewater" ${ice >= 3 ? '' : 'disabled'}>Make water bottles (3 kg ice each)</button></div>`;
    }
    if (o.level >= 4) {
      let val = 0; for (const v of invs) for (const k in v) if (ITEMS[k].kind === 'ore' || ITEMS[k].kind === 'loot') val += Math.floor(v[k]) * ITEMS[k].price * G.dset.sell * 0.85;
      h += `<div class="card"><h3>💱 Trade Pad</h3><p>Sell ore here for 85% of the base price.</p><button class="btn" data-act="sell" ${val >= 1 ? '' : 'disabled'}>Sell all ore (🪙${fmtInt(val)})</button>
        ${shipHere ? `<button class="btn" data-act="fuel">⛽ Buy fuel (🪙0.25/kg)</button>` : ''}</div>`;
    }
    if (o.level < 4) {
      const nx = L[o.level + 1];
      h += `<div class="card"><h3>⬆️ Upgrade: ${nx.name}</h3><p>${nx.desc}</p><p class="cost">${Inv.costText(nx.cost, invs)}</p>
        <p class="dim small">Uses materials from your backpack${shipHere ? ' and rocket' : ''}.</p>
        <button class="btn" data-act="up" ${Inv.canPay(invs, nx.cost, G.coins) ? '' : 'disabled'}>Build it!</button></div>`;
    } else h += `<div class="card"><h3>⭐ Fully upgraded!</h3><p>This is a big, proper base now.</p></div>`;
    h += '</div></div>';
    el.innerHTML = h;
    el.onclick = e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) this.act(b.dataset.act); };
  },
  act(a) {
    const o = G.outposts[this.cur], invs = this.invs();
    if (a === 'close') return this.close();
    if (a === 'collect') { const n = Math.floor(o.stock); o.stock -= n; Inv.add(G.pack, 'ration', n); this.msg = `Collected ${n} rations!`; Sfx.good(); }
    if (a === 'icefuel') {
      let ice = 0; for (const v of invs) ice += v.ice || 0;
      const [tf, tc] = Ship.totalFuel(); const use = Math.min(ice, tc - tf);
      if (use < 1) this.msg = 'Your tanks are already full!';
      else { Inv.pay(invs, { ice: use }); Ship.fillFuel(use); this.msg = `Made ${fmtKg(use)} of fuel from ice!`; Sfx.good(); Game.milestone('refuelIce'); }
    }
    if (a === 'icewater') {
      let ice = 0; for (const v of invs) ice += v.ice || 0;
      const n = Math.min(5, Math.floor(ice / 3)); Inv.pay(invs, { ice: n * 3 }); Inv.add(G.pack, 'water', n); this.msg = `Made ${n} water bottles.`; Sfx.good();
    }
    if (a === 'sell') {
      let got = 0;
      for (const v of invs) for (const k of Object.keys(v)) if (ITEMS[k].kind === 'ore' || ITEMS[k].kind === 'loot') { const n = Math.floor(v[k]); got += n * ITEMS[k].price * G.dset.sell * 0.85; Inv.add(v, k, -n); }
      G.coins += Math.round(got); Ship.exists && Ship.refreshMass(); this.msg = `Sold for 🪙${fmtInt(got)}!`; Sfx.coin(); Game.milestone('firstSale');
    }
    if (a === 'fuel') {
      const [tf, tc] = Ship.totalFuel(); const kg = Math.min(tc - tf, G.coins / 0.25);
      if (kg >= 1) { Ship.fillFuel(kg); G.coins -= Math.ceil(kg * 0.25); this.msg = `Bought ${fmtKg(kg)} of fuel.`; Sfx.coin(); }
    }
    if (a === 'up') {
      const nx = OUTPOST_LEVELS[o.level + 1];
      if (Inv.canPay(invs, nx.cost, G.coins)) {
        Inv.pay(invs, nx.cost); o.level++; o.t = G.time; this.rebuild(this.cur);
        Ship.exists && Ship.refreshMass();
        this.msg = `Built the ${nx.name}!`; Sfx.good();
        if (o.level >= 4) Game.milestone('bigOutpost');
      }
    }
    this.render();
  },
};

<script>
/* game.js */
'use strict';
// Main loop, modes (title / on foot / in rocket), saving, menus.

let G = null;
const World = { cameraDirBody: new V3() };

const Game = {
  mode: 'title', ui: null, warpIdx: 0, WARPS: [1, 2, 4, 10, 50, 100, 500, 1000], warpNow: 1,
  focusBody: 'verdant', focusP: new V3(), saveT: 0, lodT: 0, checkT: 0, titleT: 0, last: 0,

  wantsLock() { return (this.mode === 'foot' || this.mode === 'ship') && !this.ui && !MapView.open; },
  dragLooks() { return false; },
  uiOpen() { return !!this.ui || this.mode === 'dead' || this.mode === 'title'; },
  warpWanted() { return this.WARPS[this.warpIdx]; },
  // Graphics level: picked by the player in the pause menu. Changes how many pixels get drawn.
  GFX: { high: { name: 'High', ratio: () => Math.min(devicePixelRatio, 2), mirror: 4 },
         medium: { name: 'Medium', ratio: () => Math.min(devicePixelRatio, 2) * 0.75, mirror: 8 },
         low: { name: 'Low', ratio: () => Math.min(devicePixelRatio, 2) * 0.5, mirror: 0 } },
  gfx: (() => { try { return localStorage.getItem('bobbleOrbitGfx') || 'high'; } catch (e) { return 'high'; } })(),
  applyGfx() {
    if (!this.GFX[this.gfx]) this.gfx = 'high';
    World.renderer.setPixelRatio(this.GFX[this.gfx].ratio());
    World.renderer.setSize(innerWidth, innerHeight);
  },
  setGfx(k) { this.gfx = k; try { localStorage.setItem('bobbleOrbitGfx', k); } catch (e) {} this.applyGfx(); },

  init() {
    const canvas = $('view');
    const r = World.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
    this.applyGfx(); r.setSize(innerWidth, innerHeight);
    const scene = World.scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0);
    World.camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 4e5);
    World.raycaster = new THREE.Raycaster();
    World.sun = new THREE.PointLight(0xfff2dc, 1.25, 0, 0); scene.add(World.sun);
    World.amb = new THREE.AmbientLight(0x8a96c8, 0.3); scene.add(World.amb);
    // stars
    const sg = new THREE.BufferGeometry(), sp = [], rng = mulberry32(42), d = new V3();
    for (let i = 0; i < 4000; i++) { randDir(rng, d).multiplyScalar(1.5e5); sp.push(d.x, d.y, d.z); }
    sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
    World.stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, fog: false, depthWrite: false }));
    scene.add(World.stars);
    addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); World.camera.aspect = innerWidth / innerHeight; World.camera.updateProjectionMatrix(); });
    Input.init(canvas); Hud.init(); MapView.init($('map')); Hangar.init();
    initBodies(); updateBodies(0);
    G = { depleted: {}, outposts: [], dset: DIFFS.normal, time: 0, pack: {}, storage: {}, coins: 0, suit: 'rookie', suits: ['rookie'], drill: 1, unlocks: {}, milestones: {} };
    $('loading').textContent = 'Building planets…';
    setTimeout(() => {
      buildBodies(scene);
      Player.init();
      $('loading').classList.add('hide');
      this.showTitle();
      const loop = () => { requestAnimationFrame(loop); this.frame(); };
      loop();
    }, 60);
    addEventListener('beforeunload', () => this.autosave());
  },

  // ---------- title screen ----------
  showTitle() {
    this.mode = 'title'; Hud.show(false);
    const el = $('title'); el.classList.remove('hide');
    let h = '';
    for (let i = 1; i <= 3; i++) {
      const s = Save.read(i);
      if (s) {
        const where = s.mode === 'ship' && s.ship ? `in a rocket near ${Bodies[s.ship.soi].name}` : `on ${Bodies[(s.player && s.player.body) || 'verdant'].name}`;
        const ms = Object.keys(s.milestones || {}).length;
        h += `<div class="slot"><div class="sn">Slot ${i}</div><div class="si"><b>${DIFFS[s.diff].name}</b> · 🪙 ${fmtInt(s.coins)} · ${where}<br><span class="dim">🏆 ${ms}/${MILESTONES.length} milestones · ${new Date(s.saved || Date.now()).toLocaleString()}</span></div>
          <button class="btn big" data-act="play" data-arg="${i}">▶ Play</button><button class="btn sm warn" data-act="del" data-arg="${i}">Delete</button></div>`;
      } else h += `<div class="slot empty"><div class="sn">Slot ${i}</div><div class="si dim">Empty</div><button class="btn big" data-act="new" data-arg="${i}">✨ New game</button></div>`;
    }
    $('slots').innerHTML = h;
    el.onclick = e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      Sfx.init(); Sfx.ui();
      const i = +b.dataset.arg;
      if (b.dataset.act === 'play') this.start(i, Save.read(i));
      if (b.dataset.act === 'del') { if (confirm(`Delete slot ${i}? This can't be undone.`)) { Save.clear(i); this.showTitle(); } }
      if (b.dataset.act === 'new') this.pickDifficulty(i);
      if (b.dataset.act === 'diff') this.start(+b.dataset.slot, null, b.dataset.d);
      if (b.dataset.act === 'back') this.showTitle();
    };
  },
  pickDifficulty(i) {
    $('slots').innerHTML = `<div class="diffs">${Object.keys(DIFFS).map(k => `<div class="diff"><h3>${DIFFS[k].name}</h3><p>${DIFFS[k].desc}</p>
      <button class="btn big" data-act="diff" data-d="${k}" data-slot="${i}">Pick ${DIFFS[k].name}</button></div>`).join('')}</div>
      <button class="btn sm" data-act="back">← Back</button>`;
  },
  titleFrame(dt) {
    this.titleT += dt * 0.05;
    updateBodies(200 + this.titleT * 40);
    this.focusBody = 'verdant';
    this.focusP.set(Math.cos(this.titleT) * 1300, 380, Math.sin(this.titleT) * 1300);
    this.placeWorld();
    const cam = World.camera; cam.position.set(0, 0, 0); cam.up.set(0, 1, 0);
    cam.lookAt(this.focusP.clone().negate().add(new V3(0, 120, 0)));
    this.sky();
    World.stars.position.copy(cam.position);
    World.renderer.render(World.scene, cam);
  },
  start(slot, data, diff) {
    const fresh = !data;
    if (fresh) data = {
      v: 1, slot, diff, time: 0, coins: DIFFS[diff].coins, storage: {}, pack: { ration: 2, water: 2 }, suit: 'rookie', suits: ['rookie'], drill: 1,
      unlocks: {}, milestones: {}, outposts: [], depleted: {}, respawn: { body: 'verdant', dir: null }, draft: null, mode: 'foot', player: null, ship: null,
      stats: { o2: 100, food: 100, water: 100, hp: 100 },
    };
    G = data; G.slot = slot; G.dset = DIFFS[G.diff];
    if (fresh) { // start in the morning: put Glimmer a bit above home's horizon
      const V = Bodies.verdant, h = V.homeDir || new V3(1, 0, 0);
      const th = Math.atan2(-h.z, -h.x) - 0.9;
      G.time = (((th - V.phase) % TAU) + TAU) % TAU / V.n;
    }
    G.storage = G.storage || {}; G.pack = G.pack || {}; G.unlocks = G.unlocks || {}; G.milestones = G.milestones || {}; G.outposts = G.outposts || []; G.depleted = G.depleted || {};
    $('title').classList.add('hide'); Hud.show(true);
    Player.setSuit(G.suit);
    Player.stats = Object.assign({ o2: 100, food: 100, water: 100, hp: 100 }, G.stats || {});
    updateBodies(G.time);
    ensureDetails(Bodies.verdant);
    if (G.ship) Ship.load(G.ship);
    else if (fresh) { Ship.create(STARTER_DESIGN, true); Ship.placeOnPad(); }
    Rover.load();
    if (G.player && G.player.p) {
      const p = new V3().fromArray(G.player.p);
      Player.placeOn(G.player.body, p.clone().normalize(), 0.3);
      if (G.player.cam) Player.camFwd.fromArray(G.player.cam);
    } else Player.placeOn('verdant', Bodies.verdant.spawnDir.clone(), 0.3);
    this.mode = 'foot';
    if (G.mode === 'ship' && Ship.exists) this.enterShip(true);
    else Ship.showPilot(false);
    this.saveT = 0;
    if (fresh) {
      this.autosave();
      const tips = ['Welcome to <b>Verdant</b>! Walk with <b>WASD</b>, click the screen to look around with the mouse.',
        'Hold <b>LEFT MOUSE</b> on rocks with shiny crystals to zap them with your laser drill.',
        'Bring ore to the <b>Base Terminal</b> (the kiosk by the pad) and press <b>E</b> to sell it or build rocket parts.',
        'Your little rocket is on the launch pad. Press <b>F</b> next to it to hop in! Press <b>H</b> any time for help.'];
      tips.forEach((t, i) => setTimeout(() => Hud.toast(t, 'tip', 7), 800 + i * 5200));
    } else Hud.toast(`Welcome back! (${G.dset.name})`);
  },

  // ---------- main loop ----------
  frame() {
    const now = performance.now(); const dt = Math.min(0.05, (now - (this.last || now)) / 1000); this.last = now;
    if (this.mode === 'title') { this.titleFrame(dt); Input.end(); return; }
    this.keys();
    const paused = !!this.ui || this.mode === 'dead';
    if (!paused) {
      if (this.mode === 'ship') {
        this.warpNow = Ship.update(dt, this.warpWanted(), !MapView.open || true, false);
        if (this.mode === 'ship') Player.survival(dt, true);
      } else if (this.mode === 'foot') {
        this.warpNow = 1; G.time += dt;
        if (Ship.exists && !Ship.landed) Ship.update(dt, 1, false, true);
        Rover.update(dt);
        Player.update(dt);
        if (this.mode === 'foot') Player.survival(dt, false);
      }
      updateBodies(G.time);
      Ship.updateVisual(dt); Debris.update(dt); Fx.update(dt); Chunks.update(dt);
      Creatures.update(dt, this.mode === 'foot' && Bodies[Player.body].type === 'rocky');
      Structures.update(dt);
      Outposts.update(dt);
      this.checks(dt);
    } else updateBodies(G.time);
    // where the camera is
    if (this.mode === 'ship' && Ship.exists) { this.focusBody = Ship.soi; this.focusP.copy(Ship.p); }
    else { this.focusBody = Player.body; this.focusP.copy(Player.p); }
    this.lodT -= dt;
    if (this.lodT <= 0) { this.lodT = 0.4; updateDetailLOD(Bodies[this.focusBody], this.focusP); }
    this.placeWorld();
    if (this.mode === 'ship' && Ship.exists) this.cameraShip(); else this.cameraFoot();
    this.sky();
    World.stars.position.copy(World.camera.position);
    World.camera.getWorldDirection(World.cameraDirBody);
    World.scene.updateMatrixWorld();
    // keep the mirror visor's reflection fresh (a few times a second is plenty)
    const mir = this.GFX[this.gfx].mirror;
    if (mir && (this.mode === 'foot' || this.ui === 'terminal') && !MapView.open && ((this.envN = (this.envN || 0) + 1) % mir === 0)) Astro.updateReflection(World.renderer, World.scene, Player.model);
    if (this.mode === 'foot' && !paused) { Player.updateLaser(dt); this.footInteract(); }
    else { Sfx.setLaser(false); Player.beam.visible = Player.beamGlow.visible = false; Hud.prompt(this.mode === 'ship' && Ship.landed ? this.shipPrompt() : ''); }
    if (this.mode === 'ship' && !paused) this.shipKeys();
    Hud.update(dt);
    if (MapView.open) MapView.draw(dt);
    if (this.ui === 'terminal' && Terminal.tab === 'hangar' && Hangar.mode !== 'away') Hangar.render(World.renderer);
    else if (!MapView.open) World.renderer.render(World.scene, World.camera);
    this.saveT += dt;
    if (this.saveT > 30 && !paused) this.autosave();
    Input.end();
  },
  placeWorld() {
    const fb = Bodies[this.focusBody];
    const fw = fb.wp.clone().add(this.focusP);
    for (const b of BodyList) b.group.position.copy(b.wp).sub(fw);
    this.focusWorld = fw;
  },
  cameraRover() {
    const cam = World.camera, B = Bodies[Rover.body], R = Rover;
    const up = R.p.clone().normalize();
    const tgt = R.p.clone().addScaledVector(up, 2.0);
    const pitch = Player.camPitch + 0.05, cp = Math.cos(pitch), spch = Math.sin(pitch), d = R.camDist;
    const pos = tgt.clone().addScaledVector(Player.camFwd, -cp * d).addScaledVector(up, spch * d);
    const pr = pos.length(), gr = groundR(B, pos.clone().divideScalar(pr)) + 0.6;
    if (pr < gr) pos.multiplyScalar(gr / pr);
    Structures.camClamp(B.id, tgt, pos);
    if (this.shake > 0) pos.add(new V3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(this.shake * 0.8));
    cam.position.copy(pos).sub(Player.p); cam.up.copy(up);
    cam.lookAt(tgt.sub(Player.p));
  },
  cameraFoot() {
    if (Rover.driving) return this.cameraRover();
    const cam = World.camera, B = Bodies[Player.body];
    const up = Player.p.clone().normalize();
    const right = new V3().crossVectors(Player.camFwd, up).normalize();
    const tgt = Player.p.clone().addScaledVector(up, 2.05).addScaledVector(right, Player.mining ? 0.75 : 0.55); // over his right shoulder
    const cp = Math.cos(Player.camPitch), spch = Math.sin(Player.camPitch), d = Player.camDist;
    const pos = tgt.clone().addScaledVector(Player.camFwd, -cp * d).addScaledVector(up, spch * d);
    const pr = pos.length(), gr = (B.type === 'rocky' ? groundR(B, pos.clone().divideScalar(pr)) : B.R) + 0.4;
    if (pr < gr) pos.multiplyScalar(gr / pr);
    Structures.camClamp(B.id, tgt, pos);
    if (this.shake > 0) pos.add(new V3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(this.shake * 0.8));
    cam.position.copy(pos).sub(Player.p); cam.up.copy(up);
    cam.lookAt(tgt.sub(Player.p));
  },
  cameraShip() {
    const cam = World.camera, B = Bodies[Ship.soi];
    const up = Ship.p.clone().normalize();
    if (!this.ui && !MapView.open) {
      Ship.camFwd.applyAxisAngle(up, -Input.mdx * 0.004);
      Ship.camPitch = clamp(Ship.camPitch + Input.mdy * 0.003, -1.3, 1.45);
      Ship.camDist = clamp(Ship.camDist * (1 + Input.wheel * 0.12), 4, 800);
    }
    Ship.camFwd.addScaledVector(up, -Ship.camFwd.dot(up));
    if (Ship.camFwd.lengthSq() < 1e-6) Ship.camFwd.copy(anyTangent(up));
    Ship.camFwd.normalize();
    const cp = Math.cos(Ship.camPitch), spch = Math.sin(Ship.camPitch), d = Ship.camDist;
    const pos = new V3().addScaledVector(Ship.camFwd, -cp * d).addScaledVector(up, spch * d);
    if (B.type === 'rocky') {
      const bf = pos.clone().add(Ship.p), pr = bf.length(), gr = groundR(B, bf.clone().divideScalar(pr)) + 0.8;
      if (pr < gr) { bf.multiplyScalar(gr / pr); pos.copy(bf).sub(Ship.p); }
    }
    cam.position.copy(pos); cam.up.copy(up); cam.lookAt(0, 0, 0);
  },
  sky() {
    const fb = Bodies[this.focusBody], fw = this.focusWorld;
    let sunRel = Bodies.sol.wp.clone().sub(fw);
    // the glitch planet has its own (wrong) sun that is always overhead
    if (fb.glitch && this.focusP.length() < fb.R * 4) { const u = this.focusP.clone().normalize(); sunRel = u.multiplyScalar(6e4).add(anyTangent(u).multiplyScalar(3e4)); }
    World.sun.position.copy(sunRel);
    const sc = World.scene.background, up = this.focusP.clone().normalize(), sunDir = sunRel.clone().normalize();
    const dd = up.dot(sunDir);
    sc.setHex(0x000000);
    let fogD = 0, starO = 1, amb = 0.4, sunI = 1.2;
    if (fb.atmo && fb.type !== 'star') {
      const alt = this.focusP.length() - fb.R;
      const af = clamp(1 - alt / (fb.atmo.top * 1.4), 0, 1);
      const day = smoothstep(-0.18, 0.3, dd);
      sc.setHex(fb.atmo.sky).multiplyScalar(af * day);
      const sunset = clamp(1 - Math.abs(dd - 0.05) / 0.22, 0, 1) * af;
      if (sunset > 0) sc.lerp(new THREE.Color(0xff9a6a).multiplyScalar(af), sunset * 0.45);
      fogD = 0.0022 * af * (0.35 + 0.65 * day);
      starO = 1 - af * day * 0.95;
      amb = 0.42 + 0.26 * af * day;
    }
    if (fb.type === 'rocky' && this.focusP.length() < fb.R * 1.6) {
      const lit = smoothstep(-0.2, 0.06, dd);
      sunI = 1.25 * lit + 0.05;
      amb += 0.3 * (1 - lit); // moonlight-ish so night isn't pitch black
    }
    World.sun.intensity = sunI;
    World.scene.fog.color.copy(sc); World.scene.fog.density = fogD;
    World.stars.material.opacity = starO;
    World.amb.intensity = amb;
    for (const b of BodyList) if (b.atmoMat) { b.atmoMat.uniforms.sunPos.value.copy(sunRel); b.atmoMat.uniforms.center.value.copy(b.group.position); }
  },

  // ---------- keys ----------
  keys() {
    if (Input.hit('Escape')) {
      if (MapView.open) MapView.toggle();
      else if (this.ui === 'terminal') Terminal.close();
      else if (this.ui === 'outpost') Outposts.close();
      else if (this.ui === 'pause') this.closeMenu();
      else if (this.ui === 'help') this.closeMenu();
      else if (!this.ui && this.mode !== 'dead') this.openPause();
      return;
    }
    if (this.ui || this.mode === 'dead') return;
    if (Input.hit('KeyH')) return this.openHelp();
    if (Input.hit('KeyM')) MapView.toggle();
    if (this.mode === 'ship') {
      if (Input.hit('Period')) { this.warpIdx = Math.min(this.WARPS.length - 1, this.warpIdx + 1); }
      if (Input.hit('Comma')) { this.warpIdx = Math.max(0, this.warpIdx - 1); }
      if (Input.hit('Slash') || Input.hit('Backspace')) this.warpIdx = 0;
    }
    if (this.mode === 'foot') {
      if (Input.hit('Digit1')) Player.eat();
      if (Input.hit('Digit2')) Player.drink();
    }
  },
  shipKeys() {
    if (Input.hit('KeyG')) { G.hideFlyTips = !G.hideFlyTips; Sfx.ui(); }
    if (Input.hit('KeyF')) this.exitShip();
    if (Input.hit('KeyR')) this.crackIce();
    if (Input.hit('KeyV')) this.roverOut();
  },
  shipPrompt() {
    const l = ['F: Get out'];
    if (Ship.partCount('cracker')) l.push('R: Crack ice into fuel');
    if (Rover.hasBay()) l.push('V: Drive out the rover 🚙');
    const up = Ship.p.clone().normalize(); const nose = new V3(0, 1, 0).applyQuaternion(Ship.q);
    if (nose.dot(up) < 0.7) l.push('U: Flip rocket upright');
    return l.join(' · ');
  },
  roverOut() {
    if (!Rover.hasBay()) { Hud.toast('You need a Rover Bay on your rocket. Buy the blueprint at the base shop, then add it in the Hangar.'); return; }
    if (!Ship.landed) { Hud.toast('Land first, then press V to drive the rover out.'); return; }
    if (Bodies[Ship.soi].type !== 'rocky') return;
    Rover.deploy();
  },
  footInteract() {
    if (Rover.driving) return Rover.interact();
    const B = Bodies[Player.body], p = Player.p; const lines = []; let act = null;
    const nearShip = Ship.exists && Ship.soi === B.id && p.distanceTo(Ship.p) < Ship.reach + 4.5;
    const op = Outposts.nearest(B.id, p, 7.5);
    const si = Structures.interact(p);
    if (si) { lines.push(si.text); act = si.act; }
    else if (op) { lines.push('<b>E</b>: Use outpost'); act = () => Outposts.open(op.i); }
    else if (B.home && B.terminalPos && p.distanceTo(B.terminalPos) < 7) { lines.push('<b>E</b>: Base Terminal (sell, shop, suits, hangar)'); act = () => Terminal.open('store'); }
    else if (B.home && B.hangarPos && p.distanceTo(B.hangarPos) < 14) { lines.push('<b>E</b>: Hangar (build your rocket)'); act = () => Terminal.open('hangar'); }
    else {
      let pk = null;
      if (B.pickables) for (const k of B.pickables) if ((k.ready || G.time > k.t) && k.p.distanceTo(p) < 2.6) { pk = k; break; }
      if (pk) {
        const it = ITEMS[pk.kind];
        lines.push(`<b>E</b>: Pick ${it.name.toLowerCase()} ${it.icon}`);
        act = () => {
          if (Player.packFree() < it.unitMass * 3) { Hud.toast('Backpack full!'); return; }
          Inv.add(G.pack, pk.kind, 3); pk.ready = false; pk.t = G.time + 240; Sfx.pop(); Hud.float(`+3 ${it.name}`, 0xffa0d0);
        };
      } else if (B.sea && B.sea.kind === 'water' && (Player.swim || heightAt(B, p.clone().normalize()) < B.sea.h + 0.5)) {
        lines.push('<b>E</b>: Drink water 💧');
        act = () => { Player.stats.water = 100; const n = Math.min(3, Math.floor(Player.packFree() / 0.5)); if (n > 0) Inv.add(G.pack, 'water', n); Hud.toast(`Refreshing!${n ? ` Filled ${n} bottles.` : ''}`); Sfx.good(); };
      }
    }
    const nearRover = Rover.out && Rover.body === B.id && p.distanceTo(Rover.p) < 3.6;
    if (nearRover && !act) { lines.push('<b>E</b>: Drive the rover 🚙'); act = () => Rover.getIn(); }
    if (nearShip) {
      lines.push(act ? '<b>F</b>: Get in rocket' : '<b>F</b> or <b>E</b>: Get in rocket');
      if (!act) act = () => this.enterShip();
      if (Ship.alive.some(a => !a)) lines.push(`<b>R</b>: Repair rocket (${Inv.costText(repairCost(), this.repairInvs(), G.coins)})`);
    }
    if (nearShip && Rover.hasBay() && Ship.landed) lines.push(Rover.out && Rover.body === B.id && Rover.p.distanceTo(Ship.p) < 400 ? '<b>V</b>: Call the rover back to its bay' : '<b>V</b>: Drive out the rover 🚙');
    if (Ship.exists && Ship.cargo.kit > 0 && !(B.home && p.distanceTo(B.padPos) < 200)) lines.push('<b>B</b>: Build outpost here');
    Hud.prompt(lines.join('<br>'));
    if (Input.hit('KeyE') && act) act();
    if (Input.hit('KeyF') && nearShip) this.enterShip();
    if (Input.hit('KeyR') && nearShip && Ship.alive.some(a => !a)) this.repairField();
    if (Input.hit('KeyB')) Outposts.create();
    if (Input.hit('KeyV') && nearShip && Rover.hasBay() && Ship.landed) {
      if (Rover.out && Rover.body === B.id && Rover.p.distanceTo(Ship.p) < 400) { Rover.park(); } else this.roverOut();
    }
  },
  repairInvs() { const l = [G.pack, Ship.cargo]; if (shipAtPad()) l.push(G.storage); return l; },
  repairField() {
    const c = repairCost(), invs = this.repairInvs();
    if (!Inv.canPay(invs, c, G.coins)) { Hud.toast('Not enough materials to repair. Carry the ore in your backpack or rocket.', 'bad'); Sfx.bad(); return; }
    Inv.pay(invs, c); G.coins -= c.coins || 0; doRepair(); Hud.toast('🔧 Rocket repaired!');
  },
  enterShip(silent) {
    Input.pressed = {}; // the F that got us in mustn't also hop us straight back out this frame
    Player.jetting = false; Player.flipT = 0; Sfx.setThrust(0);
    this.mode = 'ship'; Player.hide(); Ship.showPilot(true);
    if (!silent) {
      let moved = 0;
      for (const k of Object.keys(G.pack)) {
        const it = ITEMS[k]; if (it.kind !== 'ore' && it.kind !== 'loot') continue;
        const n = Math.min(G.pack[k], Math.floor(Ship.cargoFree() / Inv.unitMass(k)));
        if (n > 0) { Inv.add(Ship.cargo, k, n); Inv.add(G.pack, k, -n); moved += n; }
      }
      Ship.refreshMass();
      if (moved) Hud.toast(`Unloaded ${fmtKg(moved)} of ore into the rocket's cargo.`);

  exitShip() {
    if (!Ship.landed) { Hud.toast('You can only get out when the rocket has landed and stopped.'); return; }
    Input.pressed = {};
    const B = Bodies[Ship.soi], up = Ship.p.clone().normalize();
    const side = new V3().crossVectors(Ship.camFwd, up).normalize();
    const dir = up.clone().addScaledVector(side, 2.8 / B.R).normalize();
    Player.placeOn(Ship.soi, dir, 0.3); Player.camFwd.copy(Ship.camFwd); Player.v.set(0, 0, 0);
    this.mode = 'foot'; Ship.showPilot(false); Sfx.setThrust(0); this.warpIdx = 0;
    if (Player.swim) Hud.toast('Splash! You hopped out into the water.');

  crackIce() {
    if (!Ship.landed) return;
    if (!Ship.partCount('cracker')) { Hud.toast('You need an Ice Cracker part. Buy its blueprint at the base shop.'); return; }
    const ice = (Ship.cargo.ice || 0) + (G.pack.ice || 0);
    const [tf, tc] = Ship.totalFuel(), use = Math.floor(Math.min(ice, tc - tf));
    if (ice < 1) { Hud.toast('No ice in your rocket! Mine ice near the rocket and it flies into the cargo.'); return; }
    if (use < 1) { Hud.toast('Tanks are already full!'); return; }
    Inv.pay([Ship.cargo, G.pack], { ice: use }); Ship.fillFuel(use);

  // ---------- events ----------

    const m = { pip: 'landPip', cinder: 'landCinder', glacia: 'landGlacia', zyx: 'landZyx', shard: 'landShard', glitch: 'glitch' }[id];
    if (m) this.milestone(m);

    if (this.mode !== 'ship') return;
    const B = Bodies[Ship.soi];

  checks(dt) {

      <b>Space</b> drop a stage · <b>P</b> parachute · <b>T</b> stability assist<br><b>Hold L</b> auto-land (lands softly by itself) · <b>G</b> flying tips<br><b>,</b> / <b>.</b> time warp · <b>M</b> orbit map · <b>F</b> get out (after landing) · <b>U</b> flip upright</p>
      <h3>🚙 The Rover</h3><p>Buy the <b>Rover Bay</b> blueprint at the base shop and add it to your rocket in the Hangar. After landing press <b>V</b> to drive out. <b>W/S</b> drive, <b>A/D</b> steer, <b>SHIFT</b> boost, <b>SPACE</b> jump. In the air, hold <b>W/S/A/D</b> to do flips (land them for coins!). Hold the <b>left mouse button</b> and the drill arm zaps ore into the rover's cargo box. Drive back to your rocket and press <b>V</b> to park it and unload the ore.</p>
      <h3>🗺️ Places to find</h3><p>🛸 A crashed saucer on <b>Pip</b> (someone is stuck inside!) · 🏛️ An alien temple full of puzzles and traps on <b>Zyx</b> · 🧊 Slippery ice caves on <b>Glacia</b> · 🌋 An erupting volcano on <b>Cinder</b> (lava bombs leave ore!) · 🌀 A wormhole floating in space between Verdant and Glacia... where does it go? Look for the tall coloured light beams, and the icons on the map (M).</p>
      <h3>🌍 Getting to orbit</h3><p>1. Full throttle straight up. 2. At about 60 m high, tilt sideways a bit. 3. Keep tilting until you fly flat along the horizon. 4. Cut the engine when the map (M) shows a full loop above the air (Periapsis over 150 m). The ⊕ marker shows which way you're moving.</p>
      <h3>⛽ Landing</h3><p>Point the rocket at the ⊗ marker (backwards) and burn to slow down. Touch down slower than about 6 m/s on legs, or parts break off!</p></div></div>
      <button class="btn big" data-m="close">Got it!</button></div>`;
    $('menu').classList.remove('hide');
    $('menu').onclick = e => { const b = e.target.closest('[data-m]'); if (b) this.closeMenu(); };
  },
  closeMenu() { $('menu').classList.add('hide'); this.ui = null; },
  autosave() {
    if (!G || !G.slot || this.mode === 'title') return;
    this.saveT = 0;
    G.ship = Ship.serialize();
    if (this.mode === 'foot') G.player = { body: Player.body, p: (Rover.driving ? Rover.p.clone().addScaledVector(new V3(1, 0, 0).applyQuaternion(Rover.q), -2.4) : Player.p).toArray(), cam: Player.camFwd.toArray() };
    Rover.save();
    if (this.mode === 'dead') { const r = G.respawn || {}; const d = r.dir ? new V3().fromArray(r.dir) : Bodies.verdant.spawnDir; G.player = { body: r.body || 'verdant', p: d.clone().normalize().multiplyScalar(Bodies[r.body || 'verdant'].R + 50).toArray() }; }
    G.mode = this.mode === 'ship' ? 'ship' : 'foot';
    G.stats = Player.stats; G.saved = Date.now();
    const d = Object.assign({}, G); delete d.dset;
    Save.write(G.slot, d);
  },
};

addEventListener('load', () => Game.init());

</script>
